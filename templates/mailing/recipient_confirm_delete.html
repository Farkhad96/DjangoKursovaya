{% extends "base.html" %}

{% block title %}Удалить получателя{% endblock %}

{% block content %}
<h1>Удалить получателя?</h1>
<p>Вы уверены, что хотите удалить <strong>{{ object.full_name }}</strong> ({{ object.email }})?</p>
<form method="post">
    {% csrf_token %}
    <div class="actions">
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'mailing:recipient_list' %}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
