{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {% if field.name == "recipients" %}
                <ul class="checkbox-list">{{ field }}</ul>
            {% else %}
                {{ field }}
            {% endif %}
            {{ field.errors }}
        </div>
        {% endfor %}
        <div class="actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'mailing:mailing_list' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
