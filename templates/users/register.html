{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<h1>Регистрация</h1>
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
            {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
        </div>
        {% endfor %}
        <div class="actions">
            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            <a href="{% url 'users:login' %}" class="btn btn-secondary">Уже есть аккаунт</a>
        </div>
    </form>
</div>
{% endblock %}
